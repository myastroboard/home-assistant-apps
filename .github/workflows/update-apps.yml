name: Update apps

# Bumps each app's version to its latest upstream release once the Docker Hub
# image is published, and opens (or refreshes) a pull request against main.
# See scripts/update_apps.py.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  # Lets an upstream release workflow trigger a check right away (optional).
  repository_dispatch:
    types: [upstream-release]

concurrency:
  group: update-apps
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # A PAT (not GITHUB_TOKEN) so the bot's PR can be opened and triggers the checks.
          token: ${{ secrets.GH_PAT }}

      - name: Check upstream releases
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_apps.py

      - name: Open or update pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          MESSAGE: ${{ steps.update.outputs.message }}
          BRANCH: bot/update-apps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git add -- */config.yaml */CHANGELOG.md
          git commit -m "$MESSAGE"
          # The branch is always rebuilt from main, so overwriting it is safe.
          git push --force origin "$BRANCH"
          pr=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}&base=main&per_page=1" --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr}" --method PATCH -f title="$MESSAGE"
          else
            gh api "repos/${GITHUB_REPOSITORY}/pulls" --method POST \
              -f base=main -f head="$BRANCH" -f title="$MESSAGE" \
              -f body="Automated version bump opened by the Update apps workflow."
          fi
