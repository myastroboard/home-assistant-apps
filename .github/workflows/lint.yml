name: Lint

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  find:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.apps.outputs.apps }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: List apps
        id: apps
        run: |
          apps=$(ls -d */config.yaml | xargs -n1 dirname | jq -R . | jq -cs .)
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  lint:
    needs: find
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.find.outputs.apps) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Lint ${{ matrix.app }}
        uses: frenck/action-addon-linter@v2
        with:
          path: "./${{ matrix.app }}"

  update-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Dry-run the update script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_apps.py --dry-run
